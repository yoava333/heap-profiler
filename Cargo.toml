[package]
name = "heap-profiler"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "heap_profiler"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30"
pyo3-ffi = "0.30"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
once_cell = "1.21.4"
smallvec = "1.16.5"
prost = "0.14.4"
hashbrown = "0.17.1"
libc = "0.2"
flate2 = "1.1.11"

[build-dependencies]
pyo3-build-config = { version = "0.30", features = ["resolve-config"] }

[profile.release]
strip = true
lto = true
