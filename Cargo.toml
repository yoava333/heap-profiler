[package]
name = "heap-profiler"
version = "0.1.8"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "heap_profiler"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["hashbrown"] }
pyo3-ffi = "0.28"
rand = "0.8.5"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
once_cell = "1.19.0"
parking_lot = "0.12"
prost = "0.13.4"
hashbrown = "0.15.2"
libc = "0.2"
flate2 = "1.0.25"

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"] }

[profile.release]
strip = true
lto = true
