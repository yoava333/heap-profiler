[package]
name = "heap-profiler"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "heap_profiler"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { path = "../../repos/pyo3" }
libc = "0.2"
lazy_static = "1.4.0"
rand = "0.8.5"
prost = "0.12"
bytes = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
