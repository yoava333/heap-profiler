[package]
name = "heap-profiler"
version = "0.1.7"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "heap_profiler"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { git = "https://github.com/yoava333/pyo3.git", branch = "expose_getframe_and_getcode", features = ["hashbrown"] }
pyo3-ffi = { git = "https://github.com/yoava333/pyo3.git", branch = "expose_getframe_and_getcode" }
rand = "0.8.5"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
tracing-appender = "0.2.3"
once_cell = "1.19.0"
prost = "0.13.4"
bytes = "1.5"
lazy_static = "1.4"
hashbrown = "0.15.2"
libc = "0.2"
flate2 = "1.0.25"

[build-dependencies]
pyo3-build-config = { version = "0.23.4", features = ["resolve-config"] }

[profile.release]
strip = true
lto = true
