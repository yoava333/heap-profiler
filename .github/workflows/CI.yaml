name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
    paths-ignore:
      - "README.md"

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - {target: x86_64, runner: ubuntu-latest}
          - {target: aarch64, runner: ubuntu-24.04-arm}
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}-${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i ${{ matrix.python-version }}
          manylinux: manylinux_2_28

      - name: Run tests
        run: |
          set -xe
          uv sync --locked --no-install-project --python ${{ matrix.python-version }}
          source .venv/bin/activate
          uv pip install --no-deps dist/*.whl
          pytest -q tests/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  performance:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64-3.11
          path: dist
      - uses: astral-sh/setup-uv@v5
      - name: Install the wheel under test
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
      - name: Measure overhead in the actual benchmark interpreter
        run: |
          .venv/bin/python benchmarks/overhead.py --iterations 100000 > baseline.json
          .venv/bin/python benchmarks/overhead.py --iterations 100000 --tracing > with_profiler.json
      - name: Check slowdown
        run: |
          set -o pipefail
          .venv/bin/python - <<'PY' | tee performance_comparison.txt
          import json
          import math
          with open("baseline.json") as stream:
              baseline = json.load(stream)
          with open("with_profiler.json") as stream:
              profiled = json.load(stream)
          assert baseline and baseline.keys() == profiled.keys()
          failures = []
          for name, seconds in baseline.items():
              assert math.isfinite(seconds) and seconds > 0
              ratio = profiled[name] / seconds
              assert math.isfinite(ratio) and ratio > 0
              print(f"{name}: {ratio:.2f}x baseline")
              if ratio > 2.5:
                  failures.append(name)
          if failures:
              raise SystemExit(f"More than 2.5x overhead: {failures}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            baseline.json
            with_profiler.json
            performance_comparison.txt

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --locked --release --out dist -i ${{ matrix.python-version }}
          sccache: "true"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: |
          set -xe
          uv sync --locked --no-install-project --python ${{ matrix.python-version }}
          source .venv/bin/activate
          uv pip install --no-deps dist/*.whl
          pytest -q tests/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, sdist, tests, performance]
    environment:
      name: pypi
      url: https://pypi.org/p/heap-profiler
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
