name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
    paths-ignore:
      - "README.md"

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.python-version }}
          manylinux: manylinux_2_28

      - name: Run tests
        run: |
          set -xe
          uv sync
          source .venv/bin/activate
          pytest -sv tests/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  performance:
    needs: linux
    runs-on: ubuntu-latest
    env:
      PYPERFORMANCE_BENCHMARKS: "2to3,json_dumps,pathlib,pickle_dict,tornado_http,sqlalchemy_imperative"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download linux wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64-3.11
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python environment
        env:
          UV_PYTHON: "3.11"
        run: |
          set -xe
          uv venv .venv
          source .venv/bin/activate
          uv pip install pyperformance
          uv pip install ./dist/*.whl

      - name: Run baseline performance tests
        run: |
          set -xe
          # Run a subset of benchmarks and save baseline
          source .venv/bin/activate
          pyperformance run -b $PYPERFORMANCE_BENCHMARKS -o baseline.json

      - name: Install heap profiler .pth file
        run: |
          set -xe
          source .venv/bin/activate
          echo "import heap_profiler; heap_profiler.start_tracing()" > .venv/lib/python3.11/site-packages/heap_profiler.pth
          # Validate that the .pth file loads
          python -c 'import sys; assert "heap_profiler" in sys.modules'

      - name: Run performance tests with heap profiler
        run: |
          set -xe
          source .venv/bin/activate
          pyperformance run -b $PYPERFORMANCE_BENCHMARKS -o with_profiler.json

      - name: Compare results
        run: |
          set -xe
          source .venv/bin/activate
          pyperformance compare baseline.json with_profiler.json > performance_comparison.txt
          cat performance_comparison.txt

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            baseline.json
            with_profiler.json
            performance_comparison.txt

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.python-version }}
          sccache: "true"

      - name: Run tests
        run: |
          set -xe
          uv sync
          source .venv/bin/activate
          pytest -sv tests/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: tests

      - name: Run tests
        run: cargo test

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, sdist, tests]
    environment:
      name: pypi
      url: https://pypi.org/p/heap-profiler
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
