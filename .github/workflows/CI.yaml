name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "README.md"

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# uv installs interpreters from Astral's mirror. setup-python downloads any
# version missing from the runner image from GitHub Releases, which fails
# whenever those downloads do.
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {target: x86_64, runner: ubuntu-latest}
          - {target: aarch64, runner: ubuntu-24.04-arm}
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      # Build in the PyPA manylinux image with maturin from PyPI. maturin-action
      # downloads maturin from GitHub Releases, which makes builds fail whenever
      # those downloads do.
      - name: Build wheels
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          docker run --rm -e PYTHON_VERSION -v "$PWD":/io -w /io \
            quay.io/pypa/manylinux_2_28_${{ matrix.platform.target }} bash -euo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
              tag="cp${PYTHON_VERSION//./}"
              python="/opt/python/${tag}-${tag}/bin/python"
              "$python" -m pip install "maturin>=1.9.3,<2"
              "$python" -m maturin build --locked --release --out dist -i "$python" --compatibility manylinux_2_28
            '

      - name: Run tests
        run: |
          set -xe
          uv sync --locked --no-install-project --python ${{ matrix.python-version }}
          source .venv/bin/activate
          uv pip install --no-deps dist/*.whl
          pytest -q tests/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  performance:
    # Instruction counts are deterministic for a given architecture and
    # interpreter build, so this runs on the setup recorded in the budget.
    needs: linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-aarch64-3.13
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Install the wheel under test
        run: |
          uv venv .venv --python "$(jq -r .python benchmarks/instruction_budget.json)"
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
      - name: Check instruction overhead
        run: python3 benchmarks/instruction_gate.py --python .venv/bin/python --output instruction_counts.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results
          path: instruction_counts.json

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build wheels
        run: |
          uv python install ${{ matrix.python-version }}
          uvx --from "maturin>=1.9.3,<2" maturin build --locked --release --out dist \
            -i "$(uv python find --system ${{ matrix.python-version }})"

      - name: Run tests
        run: |
          set -xe
          uv sync --locked --no-install-project --python ${{ matrix.python-version }}
          source .venv/bin/activate
          uv pip install --no-deps dist/*.whl
          pytest -q tests/

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build sdist
        run: uvx --from "maturin>=1.9.3,<2" maturin sdist --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: tests

      - uses: astral-sh/setup-uv@v10.3.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust
        run: |
          uv python install 3.15
          python="$(uv python find --system 3.15)"
          export PYO3_PYTHON="$python"
          # The unit tests link libpython, which is outside the loader's search path.
          export LD_LIBRARY_PATH="$("$python" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Type check Python
        run: |
          uv sync --locked --no-install-project
          uv run --no-sync ty check --error-on-warning

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, sdist, tests, performance]
    environment:
      name: pypi
      url: https://pypi.org/p/heap-profiler
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
